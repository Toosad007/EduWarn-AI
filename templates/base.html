<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hệ Thống Cảnh Báo Sớm Nguy Cơ Bỏ Học Sinh Viên{% endblock %}</title>
    <!-- Google Fonts & Bootstrap 5.3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Chart.js & Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <span>EduWarn AI</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
                            <i class="fa-solid fa-chart-pie me-1"></i> Tổng quan
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'predict_single' %}active{% endif %}" href="{{ url_for('predict_single') }}">
                            <i class="fa-solid fa-user-check me-1"></i> Dự đoán cá nhân
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'predict_batch' %}active{% endif %}" href="{{ url_for('predict_batch_view') }}">
                            <i class="fa-solid fa-file-excel me-1"></i> Dự đoán hàng loạt
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'chatbot' %}active{% endif %}" href="{{ url_for('chatbot_view') }}">
                            <i class="fa-solid fa-robot me-1"></i> Chatbot AI
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
